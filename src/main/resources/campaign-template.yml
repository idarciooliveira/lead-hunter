# Lead Hunter campaign. See docs/adr/0013-campaigns-as-yaml.md.
# Save with: lead-hunter campaign create --file campaigns/<slug>.yml

slug: clinicas-luanda
name: Clínicas em Luanda

# The 10 onboarding questions. Plain language. Used later to write pitches.
answers:
  # 1. What do you sell, in one sentence, and what does it cost?
  offer: >
    Software factory: websites, apps and consulting for small companies.
    TODO: typical project price in kwanzas.
  # 2. Which types of businesses buy from you?
  buyers: Clínicas, escolas, empresas de serviços e lojas.
  # 3. Where do you operate?
  area: Luanda first. Lubango and Benguela next.
  # 4. Your best current customers. Used to calibrate scoring.
  referenceClients:
    - ajabalg
    - kintexia
    - horizontetourangola
  # 5. How big is a good customer?
  idealSize: Small PMEs with 1 to 3 locations and regular customers.
  # 6. What problem do you solve, and how does it show from the outside?
  visiblePain: >
    No website or only Instagram. Bookings and orders by phone or DM.
    Reviews that complain nobody answers or booking is hard.
  # 7. Who should never show up?
  exclusions: Chains, banks, telecoms, government, multinationals, current clients.
  # 8. Who decides, and how do you reach them?
  decisionMaker: Owner or manager. WhatsApp message or phone call.
  # 9. What makes you different, and what results can you prove?
  proof: TODO one concrete result from a past project.
  # 10. How many leads can you work per week?
  weeklyCapacity: 35

# What the scraper searches and how stage 1 filters the results.
search:
  # Every term runs in every location.
  terms:
    - clínica
    - clínica dentária
    - centro médico
  # One scraper run per location. If a neighborhood is not recognized, use "Luanda, Angola".
  locations:
    - Talatona, Luanda, Angola
    - Maianga, Luanda, Angola
    - Kilamba, Luanda, Angola
    - Alvalade, Luanda, Angola
  maxPlacesPerSearch: 40
  language: pt-PT
  # Places whose name or category contains one of these whole words get the target sector points.
  targetKeywords:
    - clínica
    - clinic
    - dentária
    - dentist
    - centro médico
    - medical
  # Added to the built-in exclusions: banks, government, telecoms, big retail chains.
  excludeKeywords:
    - hospital
  # Current clients and anyone else you never want in the list. Matched inside the place name.
  excludeNames: []
  # Share of non-excluded places kept as QUALIFIED for stage 2.
  qualifyShare: 0.4
