services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: leadhunter
      POSTGRES_USER: leadhunter
      POSTGRES_PASSWORD: leadhunter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadhunter -d leadhunter"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The HTTP API (ADR 0031): the backend image with the `web` Spring profile.
  api:
    build: ./backend
    image: lead-hunter
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: web
      LEADHUNTER_API_TOKEN: ${LEADHUNTER_API_TOKEN:?set LEADHUNTER_API_TOKEN in .env, see .env.example}
      PGHOST: postgres
      PGPORT: "5432"
    command: []
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  # The web client (ADR 0030). Only its server talks to the API (ADR 0037).
  web:
    build: ./web
    image: lead-hunter-web
    env_file:
      - path: .env
        required: false
    environment:
      LEADHUNTER_API_URL: http://api:8080/api
      LEADHUNTER_API_TOKEN: ${LEADHUNTER_API_TOKEN:?set LEADHUNTER_API_TOKEN in .env, see .env.example}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # The CLI in a container. Only starts with `docker compose run --rm app <command>`.
  app:
    build: ./backend
    image: lead-hunter
    profiles: ["cli"]
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is "postgres", not localhost.
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./campaigns:/app/campaigns
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
