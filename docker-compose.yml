services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: leadhunter
      POSTGRES_USER: leadhunter
      POSTGRES_PASSWORD: leadhunter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadhunter -d leadhunter"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The CLI in a container. Only starts with `docker compose run --rm app <command>`.
  app:
    build: ./backend
    image: lead-hunter
    profiles: ["cli"]
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is "postgres", not localhost.
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./campaigns:/app/campaigns
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
