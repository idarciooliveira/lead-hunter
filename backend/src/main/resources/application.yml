spring:
  application:
    name: lead-hunter
  config:
    # Local settings from .env in the working directory. See .env.example.
    import: optional:file:.env[.properties]
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false
  datasource:
    # Railway's Postgres exposes PG* variables. Locally these default to docker-compose.yml.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:leadhunter}
    username: ${PGUSER:leadhunter}
    password: ${PGPASSWORD:leadhunter}

logging:
  level:
    root: WARN
    me.iofdev.leadhunter: INFO

leadhunter:
  api:
    # Bearer token the web server sends on every /api call (ADR 0037). The web profile refuses to start without it.
    token: ${LEADHUNTER_API_TOKEN:}
  apify:
    token: ${APIFY_TOKEN:}
    actor-id: compass~crawler-google-places
    poll-wait: 60s
    max-run-time: 20m
    # Apify's first answer after a run ends can hold a preliminary cost. We wait, then read it again.
    cost-settle-delay: 10s
    # Used for --dry-run estimates only. Update it from the actor's pricing page.
    estimated-usd-per-place: ${LEADHUNTER_APIFY_ESTIMATED_USD_PER_PLACE:0.004}
    max-places-per-run: ${LEADHUNTER_APIFY_MAX_PLACES_PER_RUN:600}
  llm:
    # Vercel AI Gateway, OpenAI-compatible. See ADR 0017.
    api-key: ${AI_GATEWAY_API_KEY:}
    base-url: ${LEADHUNTER_LLM_BASE_URL:https://ai-gateway.vercel.sh/v1}
    model: ${LEADHUNTER_LLM_MODEL:google/gemma-4-26b-a4b-it}
    timeout: 60s
  usage:
    # The bar in `usage`. ADR 0006 sets the budget at $10 a month.
    monthly-budget-usd: ${LEADHUNTER_USAGE_MONTHLY_BUDGET_USD:10}

---
# The JSON API for the web client (ADR 0031). The CLI keeps running as a non-web
# application: start with `SPRING_PROFILES_ACTIVE=web` to serve `/api` instead.
spring:
  config:
    activate:
      on-profile: web
  main:
    web-application-type: servlet

leadhunter:
  cli:
    enabled: false
